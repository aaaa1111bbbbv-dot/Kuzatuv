<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuzatuv Tizimi</title>
  <script src="https://unpkg.com"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; }
    .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
    h3 { margin: 0 0 10px 0; color: #38bdf8; font-size: 16px; }
    button, input { width: 100%; padding: 14px; margin-top: 8px; border-radius: 10px; border: none; font-size: 15px; box-sizing: border-box; font-weight: bold; cursor: pointer; }
    input { background: #0f172a; color: #fff; border: 1px solid #475569; font-weight: normal; }
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-green { background: #22c55e; color: #fff; }
    video { width: 100%; border-radius: 10px; background: #000; margin-top: 10px; }
    #status { padding: 12px; background: #020617; border-radius: 8px; color: #facc15; font-size: 14px; text-align: center; margin-top: 10px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card" id="viewerCard">
    <h3>📺 Mening smartfonim (Kuzatuvchi)</h3>
    <div id="status">Tayyor. So‘rov yuborish uchun pastdagi tugmani bosing.</div>
    
    <input type="text" id="botToken" placeholder="Telegram Bot Token">
    <input type="text" id="targetChatId" value="7935394255" placeholder="iPhone Telegram ID raqami">
    
    <button class="btn-blue" onclick="sendTelegramInvite()">🔔 iPhone’ga ruxsat so‘rovi yuborish</button>
    <video id="remoteVideo" autoplay playsinline></video>
    <canvas id="canvas" class="hidden"></canvas>
  </div>

  <div class="card hidden" id="cameraCard">
    <h3>📷 Kamera ruxsati</h3>
    <p style="font-size:14px; color:#cbd5e1;">Asosiy smartfon kamerangizga ulanmoqchi. Tasdiqlaysizmi?</p>
    <button class="btn-green" onclick="startStreaming()">✅ Ruxsat berish va kamerani yoqish</button>
    <div id="camStatus" style="margin-top:10px; color:#4ade80; font-size:14px;"></div>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

<script>
  const VIEWER_ID = "uz-main-viewer-7935394255";
  const SITE_URL = "https://github.io";
  const iceConfig = { iceServers: [{ urls: 'stun:://google.com' }] };
  let peer = null;
  let lastFrame = null;
  let lastAlert = 0;

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('mode') === 'camera') {
    document.getElementById('viewerCard').classList.add('hidden');
    document.getElementById('cameraCard').classList.remove('hidden');
  } else {
    initViewer();
  }

  function initViewer() {
    peer = new Peer(VIEWER_ID, { config: iceConfig });
    peer.on('open', () => {
      document.getElementById('status').innerText = "✅ Tizim tayyor! So‘rov yuborishingiz mumkin.";
    });

    peer.on('call', (call) => {
      document.getElementById('status').innerText = "🟢 Ruxsat berildi! Jonli video ko‘rsatilmoqda.";
      call.answer();
      call.on('stream', (stream) => {
        const video = document.getElementById('remoteVideo');
        video.srcObject = stream;
        detectMotion(video);
      });
    });
  }

  function sendTelegramInvite() {
    const token = document.getElementById('botToken').value.trim();
    const chatId = document.getElementById('targetChatId').value.trim();
    if (!token || !chatId) return alert("Bot Token va ID raqamini kiriting!");

    const text = `🔔 Kameraga ulanish so‘rovi!\n\nRuxsat berish uchun havolani bosing:\n${SITE_URL}`;
    const statusBox = document.getElementById('status');
    statusBox.innerText = "⏳ Telegram’ga yuborilmoqda...";

    const apiUrl = `https://telegram.org{token}/sendMessage?chat_id=${encodeURIComponent(chatId)}&text=${encodeURIComponent(text)}`;

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          statusBox.innerText = "📩 Xabar yuborildi! iPhone Telegram’idan havolani bosing.";
        } else {
          statusBox.innerText = "❌ Telegram xatosi: " + data.description;
        }
      })
      .catch(err => {
        statusBox.innerText = "❌ Internet xatosi: " + err.message;
      });
  }

  function startStreaming() {
    document.getElementById('camStatus').innerText = "⏳ Kamera yoqilmoqda...";
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then((stream) => {
        document.getElementById('localVideo').srcObject = stream;
        peer = new Peer({ config: iceConfig });
        peer.on('open', () => {
          peer.call(VIEWER_ID, stream);
          document.getElementById('camStatus').innerText = "🟢 Ulandi! Tasvir uzatilmoqda.";
        });
      })
      .catch(err => {
        document.getElementById('camStatus').innerText = "❌ Xatolik: " + err.message;
      });
  }

  function detectMotion(video) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    setInterval(() => {
      if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
      canvas.width = 320; canvas.height = 240;
      ctx.drawImage(video, 0, 0, 320, 240);
      const frame = ctx.getImageData(0, 0, 320, 240).data;
      if (lastFrame) {
        let diff = 0;
        for (let i = 0; i < frame.length; i += 16) {
          if (Math.abs(frame[i] - lastFrame[i]) > 35) diff++;
        }
        if (diff > 150 && Date.now() - lastAlert > 15000) {
          lastAlert = Date.now();
          const token = document.getElementById('botToken').value.trim();
          const chatId = document.getElementById('targetChatId').value.trim();
          if (!token || !chatId) return;
          canvas.toBlob((blob) => {
            const fd = new FormData();
            fd.append('chat_id', chatId);
            fd.append('photo', blob, 'alert.jpg');
            fd.append('caption', '🚨 Kamerada harakat aniqlandi!');
            fetch(`https://telegram.org{token}/sendPhoto`, { method: 'POST', body: fd });
          }, 'image/jpeg', 0.8);
        }
      }
      lastFrame = new Uint8ClampedArray(frame);
    }, 500);
  }
</script>
</body>
</html>
